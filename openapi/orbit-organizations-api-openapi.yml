openapi: 3.0.1
info:
  title: Orbit Activities Organizations API
  version: v1
  description: Please see the complete Orbit API documentation at [https://api.orbit.love/](https://api.orbit.love/).
servers:
- url: http://web.archive.org/web/20240303060821/https://app.orbit.love/api/v1
tags:
- name: Organizations
paths:
  /{workspace_slug}/organizations:
    get:
      summary: List organizations in a workspace
      tags:
      - Organizations
      security:
      - bearer: []
      parameters:
      - name: workspace_slug
        in: path
        required: true
        schema:
          type: string
      - name: query
        in: query
        schema:
          type: string
      - name: page
        in: query
        schema:
          type: string
      - name: direction
        in: query
        schema:
          type: string
          enum:
          - ASC
          - DESC
      - name: items
        in: query
        schema:
          type: string
          enum:
          - '10'
          - '50'
          - '100'
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - name
          - website
          - members_count
          - employees_count
      responses:
        '200':
          description: success
          content:
            application/json:
              example:
                data:
                - id: n5ZF98
                  type: organization
                  attributes:
                    id: n5ZF98
                    name: Organization2
                    website: org2.example.com
                    logo_url: null
                    members_count: 1
                    employees_count: null
                    organization_type: null
                    industry: null
                    estimated_annual_revenue: null
                    founded_in: null
                    location: null
                    twitter: null
                    twitter_followers: null
                    facebook: null
                    facebook_followers: null
                    linkedin: null
                    crunchbase: null
                    email_addresses: null
                    last_active: null
                    active_since: null
                    created_at: '2023-06-21T14:54:41.767Z'
                    updated_at: '2023-06-21T14:54:41.767Z'
                    lifecycle_stage: null
                    deal_closed_date: null
                    price_plan: null
                    crm_uid: null
                    crm_url: null
                    owner_name: null
                    owner_email: null
                    source: null
                - id: V02F9A
                  type: organization
                  attributes:
                    id: V02F9A
                    name: Organization1
                    website: org1.example.com
                    logo_url: null
